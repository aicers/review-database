[package]
name = "review-database"
version = "0.61.0"
edition = "2024"

[dependencies]
aho-corasick = "1"
anyhow = "1"
attrievent = { git = "https://github.com/aicers/attrievent.git", tag = "0.4.0" }
aws-lc-rs = { version = "1", default-features = false, features = ["alloc", "non-fips"] }
bincode = "1"
chrono = { version = "0.4.42", default-features = false, features = ["serde"] }
config = { version = "0.15", optional = true }
data-encoding = "2"
flate2 = "1"
ip2location = "0.6"
ipnet = { version = "2", features = ["serde"] }
jiff = "0.2"
memchr = "2"
num-derive = "0.5"
num-traits = "0.2"
rand = "0.10"
regex = "1"
review-protocol = { git = "https://github.com/aicers/review-protocol.git", tag = "0.24.0" }
rocksdb = "0.25"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
structured = "0.16"
strum = "0.28"
strum_macros = "0.28"
thiserror = "2"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "review-migrate"
required-features = ["migrate"]
path = "src/migrate.rs"

[features]
default = []
migrate = ["config", "tracing-subscriber"]

[lints.clippy]
pedantic = "warn"
unwrap_used = "warn"
