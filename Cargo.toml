[package]
name = "review-database"
version = "0.71.1"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
attrievent = { git = "https://github.com/aicers/attrievent.git", tag = "0.11.0" }
aws-lc-rs = { version = "1", default-features = false, features = ["alloc", "non-fips"] }
bincode = "1"
bincode2 = { package = "bincode", version = "2", features = ["serde"] }
config = { version = "0.15", optional = true }
data-encoding = "2"
flate2 = "1"
ip2location = "0.6"
ipnet = { version = "2", features = ["serde"] }
jiff = { version = "1", features = ["serde"] }
memchr = "2"
num-derive = "0.5"
num-traits = "0.2"
rand = "0.10"
review-protocol = { git = "https://github.com/aicers/review-protocol.git", tag = "0.34.0" }
rocksdb = "0.25"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
structured = "0.18"
strum = "0.28"
strum_macros = "0.28"
thiserror = "2"
toml = "1"
toml_edit = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
tempfile = "3"

# release-plz runs cargo-semver-checks before each release. It reads the
# `update` methods of the separate `impl IndexedTable<'_, T>` blocks as one
# method, so the ones taking `&mut self` (`Category`, `Network`, ...) look
# like a receiver change from those taking `&self` (`CsvColumnExtra`) even
# when nothing changed, and every release would raise the minor. Only that
# lint is turned off; a real receiver change still takes a `!` title.
[package.metadata.cargo-semver-checks.lints]
method_receiver_ref_became_mut = "allow"

[[bin]]
name = "review-migrate"
required-features = ["migrate"]
path = "src/migrate.rs"

[features]
default = []
migrate = ["config", "tracing-subscriber"]

[lints.clippy]
pedantic = "warn"
unwrap_used = "warn"
